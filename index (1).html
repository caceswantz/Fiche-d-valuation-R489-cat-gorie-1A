<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grille d’évaluation CACES – Catégorie 1A</title>
<style>
:root{--bg:#e6e9ec;--card:#fff;--ink:#1b2430;--mute:#5d6b7a;--line:#c9d0d7;--accent:#f2b705;--red:#c62828;--redbg:#fde8e8;--green:#2e7d32;--greenbg:#e6f4e7}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--card:#212832;--ink:#eef1f4;--mute:#9aa7b4;--line:#38424e;--redbg:#4a2022;--greenbg:#1f3a22;--red:#ff6b6b;--green:#6fcf76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--accent);color:#1b2430;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.2rem}
header input{font:inherit;padding:10px;border:2px solid #1b2430;border-radius:6px;min-width:220px;background:#fff;color:#1b2430}
main{max-width:900px;margin:0 auto;padding:12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 16px;overflow:hidden}
.exh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.exh h2{margin:0;font-size:1.1rem}
.chrono{display:flex;align-items:center;gap:10px}
.time{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;min-width:5.2ch}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.stop{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.comp{margin:0;padding:8px 14px 0;list-style:none;color:var(--mute);font-size:.92rem}
.comp li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.bloc{padding:12px 14px}
.bloc h3{margin:0 0 8px;font-size:1rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.row .lab{flex:1}
.row.zero{background:var(--redbg);border-color:var(--red)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:48px;padding:0;font-size:1.4rem;font-weight:700}
.val{min-width:3.4ch;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.elim{width:auto;min-width:48px;font-weight:700}
.row.e{border-color:var(--red)}
.row.e.on{background:var(--red);color:#fff}
.row.e.on button{background:#fff;color:var(--red);border-color:#fff}
.tot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--greenbg);font-weight:700}
.tot.bad{background:var(--red);color:#fff}
.tot small{font-weight:400}
.alert{display:none}
.tot.bad .alert{display:inline;font-size:1.05rem}
.recap{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px}
.recap h2{margin:0 0 8px}
.recap table{width:100%;border-collapse:collapse}
.recap th,.recap td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.verdict{margin:12px 0;padding:14px;border-radius:8px;font-size:1.2rem;font-weight:700;text-align:center}
.verdict.ok{background:var(--greenbg);color:var(--green)}
.verdict.ko{background:var(--red);color:#fff}
.err{margin:8px 0 0;padding-left:20px;color:var(--mute);font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
@media print{header input,.chrono button,.ctl button,.actions,.comp{display:none}body{background:#fff}.ex{break-inside:avoid}}
.gt{background:#1b2430;color:#fff;font-weight:700;padding:8px 14px;border-radius:8px;font-variant-numeric:tabular-nums}
.gt.bad{background:var(--red)}
.chrono small{color:var(--mute);max-width:14ch;line-height:1.2}
.recap h3{margin:14px 0 4px;font-size:1rem}
.tot+.tot{margin-top:6px}
header{position:sticky;top:0;z-index:5}
.hchrono small{display:none}
.hchrono .time{font-size:1.6rem}
.info{max-width:900px;margin:12px auto 0;padding:0 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.info label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
.info input{font:inherit;padding:10px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.bloc .comp{padding:0 0 8px}
.comp li.red{color:var(--red);font-weight:700}
.row .lab small{color:var(--mute)}
.meta{margin:0 0 8px}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
canvas.sig{display:block;width:100%;height:120px;background:#fff;border:2px solid var(--ink);border-radius:6px;touch-action:none;margin:4px 0 6px}
@media print{header{position:static}.hchrono button,.noprint{display:none!important}.comp{display:block!important}.info input{border:0;padding:0;background:transparent}}
.ctl .elim{width:auto;min-width:48px;padding:0 14px;white-space:nowrap;font-weight:700}
.row.e.on .ctl .elim{background:#fff;color:var(--red);border-color:#fff}
#fiche{display:none}
body[data-view=fiche] #fiche{display:block}
body[data-view=fiche] header,body[data-view=fiche] .info,body[data-view=fiche] #app{display:none}
#fiche .bar{position:sticky;top:0;z-index:5;background:var(--accent);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#pages{width:210mm;margin:12px auto 0}
.page{width:210mm;height:296mm;background:#fff;color:#000;font:9pt/1.25 Arial,Helvetica,sans-serif;padding:9mm 10mm;box-sizing:border-box;margin:0 0 12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.3);-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto;margin-bottom:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5mm}
.phl{width:62mm}.logo{width:62mm;display:block}.ref{font-size:8pt;margin-top:1mm}
.pht{flex:1;font:italic 700 15pt Arial,Helvetica,sans-serif;padding:11mm 4mm 0}
.phr{text-align:right;font-size:8pt;min-width:48mm}.phr b{font-size:12pt}
.pbody{flex:1}
.pf{display:flex;justify-content:space-between;gap:4mm;font-size:7.5pt}
.pf div:nth-child(2){text-align:center}.pf div:last-child{text-align:right}
#pages table{width:100%;border-collapse:collapse;table-layout:fixed}
#pages th,#pages td{border:1px solid #000;padding:1mm 1.5mm;vertical-align:middle}
#pages thead th{font-weight:700;text-align:center}
#pages .fx{font-weight:700;text-align:center;margin:3mm 0 6mm}
#pages .cand{width:70%;margin:0 0 8mm}
#pages .cand td.blank{border:0;width:28%}
#pages .cand th{font-weight:700}
#pages .ban{background:#0b2c72;color:#fff;font-weight:700;text-align:center;padding:1.5mm 2mm}
#pages .th,#pages .pt{font-weight:700;text-align:center;overflow-wrap:anywhere}#pages .th{font-size:8.5pt}
#pages .b,#pages .v{text-align:center;font-weight:700}
#pages .gh{background:#d9d9d9;font-weight:700}
#pages .st td{font-weight:700;text-align:right}
#pages .st td.b,#pages .st td.v{text-align:center}
#pages .tb{border:1px solid #000;margin-top:12mm}
#pages .tt{text-align:center;font-weight:700;padding:2mm}
#pages .tg{display:grid;grid-template-columns:1fr 1fr;gap:2mm;padding:0 3mm 3mm}
#pages .tg p{margin:2mm 0;font-weight:700}
#pages .sigimg{height:16mm;display:block}
#pages .rc{border:0}
#pages .rc th{font-size:12pt;text-align:center}
#pages .res{text-align:center;font-weight:700;font-size:14pt;width:40mm}
@page{size:A4;margin:0}
@media print{body[data-view=fiche]{background:#fff;padding:0}#fiche .bar{display:none}#pages{zoom:1!important;margin:0;width:210mm}.page{margin:0;box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1>CACES 1A – Évaluation</h1>
  <div id="gt" class="gt" aria-live="polite"></div>
  <div class="chrono hchrono"><span class="time tm">00:00</span><button id="chbtn" class="go" onclick="toggle()">Démarrer</button></div>
</header>
<section class="info">
  <label>Date<input id="date" type="date"></label>
  <label>Candidat (nom et prénom)<input id="nom" placeholder="Nom et prénom du candidat" autocomplete="off"></label>
  <label>Testeur – nom<input id="tnom" placeholder="Nom" autocomplete="off"></label>
  <label>Testeur – prénom<input id="tprenom" placeholder="Prénom" autocomplete="off"></label>
  <label>Entreprise<input id="entreprise" autocomplete="off"></label>
  <label>E-mail du destinataire<input id="dest" type="email" placeholder="adresse@exemple.fr" autocomplete="off"></label>
</section>
<main id="app"></main>
<div id="fiche"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script>
/* ===== Données de référence (non modifiables par le testeur) =====
   Ligne = [libellé, coût par erreur ou "E", index de la compétence concernée] */
const R=(l,c,i,o)=>[l,c,i,!!o];
const EX=[
{id:1,titre:"Exercice 1 – Vérification du chariot",blocs:[{nom:"",
 comp:[["Présence de la notice d’instructions",1],["Rapport de vérification périodique, absence d’observation",1],["Vérification visuelle du chariot",4],["Mécanismes et dispositifs de sécurité",4]],
 rows:[
  R("Ne pas justifier d’une interdiction d’emploi ou d’une règle d’utilisation",1,0,true),
  R("Ne pas vérifier la présence de la VGP","E",1),
  R("Ne pas vérifier l’absence d’observation",1,1,true),
  R("Ne pas vérifier l’état des fourches",1,2,true),
  R("Ne pas vérifier l’absence de fuite",1,2,true),
  R("Ne pas vérifier l’état des gallets (roues)",1,2,true),
  R("Ne pas vérifier le fonctionnement de l’A.U",1,3,true),
  R("Ne pas vérifier le fonctionnement du timon",1,3,true),
  R("Ne pas vérifier le fonctionnement de l’avertisseur sonore",1,3,true)]}]},
{id:2,titre:"Exercice 2 – Circulation (à évaluer en continu)",
 blocs:[["À vide","Circulation à vide : marche avant / arrière, ligne droite / virage, arrêt"],["En charge","Circulation en charge : marche avant / arrière, ligne droite / virage, arrêt"]].map(n=>({nom:n[0],
 comp:[[n[1],10]],
 rows:[
  R("Collision franche, intervention nécessaire pour éviter un accident, charge instable, circulation sans visibilité","E",0),
  R("Fourches mal positionnées pendant le déplacement",1,0),
  R("Prend un virage trop rapidement ou le négocie sans maîtrise",2,0),
  R("Freine brusquement ou s’arrête au mauvais endroit",2,0),
  R("Ne regarde pas dans le sens de déplacement",1,0),
  R("Roule à une vitesse inadaptée",1,0)]}))},
{id:3,titre:"Exercice 3 – Prise, déplacement et dépose d’une charge palettisée",blocs:[{nom:"",
 comp:[["S’assurer de l’adéquation du chariot à la manutention",7],["Positionner le chariot pour la prise / la palette sur la fourche",7],["Vérifier le lieu de dépose, positionner le chariot et déposer avec précision",7]],
 rows:[
  R("Ne pas prendre connaissance de la capacité nominale du chariot","E",0),
  R("Utiliser la charge dépassant la capacité","E",0),
  R("Le chariot est mal aligné avec la palette",2,1),
  R("Les fourches ne sont pas insérées correctement ou la palette est prise de travers",2,1),
  R("Ne pas vérifier que l’emplacement est libre, stable et adapté",2,2),
  R("Le chariot est mal aligné avec l’emplacement prévu",1,2),
  R("La palette est déposée de travers",1,2)]}]},
{id:4,titre:"Exercice 4 – Chargement / déchargement d’un véhicule par l’arrière",blocs:[{nom:"",
 comp:[["Adéquation du chariot et du véhicule à la manutention",7],["Moyens d’accès en sécurité au véhicule",7],["Vitesse et trajectoire du chariot",6],["Prise et dépose de 3 charges conformément au plan de chargement",7],["Déchargement du véhicule et dépose à l’endroit prévu",7]],
 rows:[
  R("Ne pas prendre connaissance de la capacité nominale du chariot",3,0,true),
  R("Ne pas prendre connaissance de la masse à vide du chariot",2,0,true),
  R("Ne pas prendre connaissance de la capacité du pont de liaison",2,0,true),
  R("Ne pas savoir mettre en œuvre les moyens d’accès en sécurité au véhicule","E",1),
  R("Le chariot dévie de sa trajectoire lors du franchissement du pont (vitesse excessive)",1,2),
  R("Le chariot est mal aligné avec la palette",1,3),
  R("Les fourches ne sont pas insérées correctement ou la palette est prise de travers",1,3),
  R("Une des charges n’est pas déposée conformément au plan de chargement",1,3),
  R("Utiliser la charge dépassant la capacité","E",0),
  R("Ne pas vérifier que l’emplacement est libre, stable et adapté",1,4),
  R("Le chariot est mal aligné avec l’emplacement prévu",1,4),
  R("La palette est déposée de travers",1,4)]}]},
{id:5,titre:"Exercice 5 – Fin de poste et maintenance journalière",blocs:[{nom:"",
 comp:[["Opérations de fin de poste à l’endroit prévu",5],["Opérations de maintenance journalière",5],["Compte rendu des anomalies relevées",5]],
 rows:[
  R("Le candidat ne coupe pas le contact",2,0,true),
  R("Il ne retire pas la clé",2,0,true),
  R("Il ne vérifie pas le niveau de charge des batteries",2,1,true),
  R("Il ne vérifie pas le niveau d’eau des batteries",3,1,true),
  R("Il ne relève pas les anomalies rencontrées dans le tableau de bord",2,2,true),
  R("Il n’informe pas le testeur des éventuelles anomalies rencontrées",3,2,true)]}]}
];

/* Thèmes officiels R489 : note ≥ moitié des points du thème, total ≥ 70/100 */
const THEMES=[
 {nom:"Prise de poste et mise en service",base:10,b:[[1,0]]},
 {nom:"Conduite",base:20,b:[[2,0],[2,1]]},
 {nom:"Manœuvres",base:55,b:[[3,0],[4,0]]},
 {nom:"Fin de poste – maintenance",base:15,b:[[5,0]]}];
const SEUIL_TOTAL=70;
const themeOf=(e,bi)=>THEMES.find(t=>t.b.some(x=>x[0]===e&&x[1]===bi));
const baseOf=b=>b.comp.reduce((a,c)=>a+c[1],0);

/* ===== État (sauvegardé automatiquement dans la tablette) ===== */
const KEY="caces1a_v4";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const frDate=s=>s?s.split("-").reverse().join("/"):"";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||typeof S!=="object")S={};
S=Object.assign({nom:"",tnom:"",tprenom:"",entreprise:"Centre de formation WANTZ",dest:"",date:"",view:"eval",d:{},t:{},sig:{}},S);
if(!S.date)S.date=today();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const k=(e,b,r)=>e+"-"+b+"-"+r;
const cnt=(e,b,r)=>S.d[k(e,b,r)]||0;
const fmt=n=>String(n).replace(".",",");
function h(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const testeur=()=>(S.tprenom+" "+S.tnom).trim();

/* Chaque erreur retire son coût à sa compétence ; le surplus est ignoré (jamais sous 0) */
function bst(e,bi){
  const b=EX[e-1].blocs[bi],lostC=b.comp.map(()=>0),flagE=b.comp.map(()=>false);let elimE=false;
  b.rows.forEach((r,ri)=>{const n=cnt(e,bi,ri);if(!n)return;
    if(r[1]==="E"){elimE=true;flagE[r[2]]=true}else lostC[r[2]]+=n*r[1]});
  const rem=b.comp.map((c,i)=>Math.max(0,c[1]-lostC[i]));
  const total=rem.reduce((a,x)=>a+x,0);
  return{rem,flagE,total,base:baseOf(b),elimE,zero:total<=0,elim:elimE||total<=0};
}
function tst(t){
  const total=t.b.reduce((a,x)=>a+bst(x[0],x[1]).total,0),seuil=t.base/2;
  return{total,seuil,elim:total<seuil};
}
function glob(){
  let total=0;const reasons=[];
  EX.forEach(ex=>ex.blocs.forEach((b,bi)=>{
    const s=bst(ex.id,bi);total+=s.total;
    const nom="Exercice "+ex.id+(b.nom?" ("+b.nom.toLowerCase()+")":"");
    if(s.elimE)reasons.push(nom+" : erreur éliminatoire");
    else if(s.zero)reasons.push(nom+" : note nulle (elle doit être supérieure à 0)");
  }));
  THEMES.forEach(t=>{const s=tst(t);if(s.elim)reasons.push("Thème « "+t.nom+" » sous le seuil ("+fmt(s.total)+" / "+t.base+", seuil "+fmt(s.seuil)+")")});
  if(total<SEUIL_TOTAL)reasons.push("Total inférieur à "+SEUIL_TOTAL+" / 100");
  return{total,reasons,elim:reasons.length>0};
}
function errList(ex){
  const list=[];
  ex.blocs.forEach((b,bi)=>b.rows.forEach((row,ri)=>{const n=cnt(ex.id,bi,ri);if(!n)return;
    const pre=b.nom?b.nom+" – ":"";
    if(row[1]==="E")list.push(pre+row[0]+" (éliminatoire)");
    else if(row[3])list.push(pre+row[0]+" (−"+row[1]+" pt"+(row[1]>1?"s":"")+")");
    else list.push(pre+row[0]+" ×"+n+" (−"+n*row[1]+" pt"+(n*row[1]>1?"s":"")+")")}));
  return list;
}

/* ===== Chronomètre unique (basé sur l’horloge : continue en veille) ===== */
const CHID="c1";
function tget(){return S.t[CHID]||(S.t[CHID]={acc:0,start:null})}
function elapsed(){const t=tget();return t.acc+(t.start?Date.now()-t.start:0)}
function clock(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function stopChrono(){const t=tget();if(t.start){t.acc+=Date.now()-t.start;t.start=null}}
function toggle(){const t=tget();
  if(t.start)stopChrono();else t.start=Date.now();
  save();render()}

/* ===== Actions ===== */
function adj(e,b,r,delta){const key=k(e,b,r);S.d[key]=Math.min(99,Math.max(0,(S.d[key]||0)+delta));save();render()}
function flipE(e,b,r){const key=k(e,b,r);S.d[key]=S.d[key]?0:1;save();render()}
function setVals(){
  [["nom","nom"],["tnom","tnom"],["tprenom","tprenom"],["entreprise","entreprise"],["dest","dest"],["date","date"]].forEach(a=>{document.getElementById(a[0]).value=S[a[1]]})}
function setView(v){S.view=v;save();render();window.scrollTo(0,0)}
function finEval(){stopChrono();setView("fiche")}
function reset(){
  if(confirm("Passer à un nouveau candidat ? Les points, le chronomètre, le nom du candidat et la signature seront effacés (le testeur, l’entreprise et l’adresse e-mail sont conservés).")){
    S={nom:"",tnom:S.tnom,tprenom:S.tprenom,entreprise:S.entreprise,dest:S.dest,date:today(),view:"eval",d:{},t:{},sig:{}};save();setVals();render();window.scrollTo(0,0)}}
function sujet(){return "Évaluation CACES 1A – "+(S.nom||"candidat")+" – "+frDate(S.date)}
function mail(){
  const g=glob(),L=[];
  L.push("Candidat : "+(S.nom||"—"),"Date : "+frDate(S.date),"Testeur : "+(testeur()||"—")+(S.entreprise?" ("+S.entreprise+")":""),"Durée de l’épreuve : "+clock(elapsed()),"",
    "TOTAL : "+fmt(g.total)+" / 100 (minimum "+SEUIL_TOTAL+")","RÉSULTAT : "+(g.elim?"ÉCHEC (candidat éliminé)":"REÇU"),"");
  if(g.reasons.length){L.push("Motifs :");g.reasons.forEach(x=>L.push("- "+x));L.push("")}
  L.push("Détail :");
  EX.forEach(ex=>ex.blocs.forEach((b,bi)=>{const s=bst(ex.id,bi);L.push("- Exercice "+ex.id+(b.nom?" ("+b.nom.toLowerCase()+")":"")+" : "+fmt(s.total)+" / "+s.base)}));
  L.push("");
  EX.forEach(ex=>{const l=errList(ex);if(l.length){L.push("Erreurs – exercice "+ex.id+" :");l.forEach(x=>L.push("- "+x))}});
  L.push("","(Fiche FORM-192 en pièce jointe si le PDF a été joint.)");
  location.href="mailto:"+encodeURIComponent(S.dest||"")+"?subject="+encodeURIComponent(sujet())+"&body="+encodeURIComponent(L.join("\n"));
}
/* Envoi du PDF de la fiche via le partage de la tablette (e-mail, etc.) */
async function sharePdf(){
  if(typeof html2pdf==="undefined"){alert("La bibliothèque PDF n’est pas chargée (connexion Internet nécessaire). Utilise « Imprimer / PDF ».");return}
  const el=document.getElementById("pages"),z=el.style.zoom,fname="FORM-192_"+(S.nom||"candidat").replace(/[^\wÀ-ÿ-]+/g,"_")+"_"+S.date+".pdf";
  const btn=document.getElementById("pdfbtn");btn.disabled=true;btn.textContent="Création du PDF…";
  el.style.zoom=1;
  try{
    const blob=await html2pdf().set({margin:0,filename:fname,image:{type:"jpeg",quality:.95},html2canvas:{scale:2,useCORS:true,scrollY:0},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:"css"}}).from(el).outputPdf("blob");
    const file=new File([blob],fname,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:sujet(),text:sujet()});
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
      alert("Le partage direct n’est pas disponible ici : le PDF a été téléchargé. Joins-le à ton e-mail.");
    }
  }catch(err){if(!(err&&err.name==="AbortError"))alert("Impossible de créer le PDF. Utilise « Imprimer / PDF ».")}
  el.style.zoom=z;btn.disabled=false;btn.textContent="Envoyer le PDF";fit();
}

/* ===== Signature du testeur (doigt ou stylet) ===== */
function sigInit(){
  document.querySelectorAll("canvas.sig").forEach(cv=>{
    const id=cv.dataset.s,ctx=cv.getContext("2d");
    ctx.lineWidth=3;ctx.lineCap="round";ctx.strokeStyle="#000";
    if(S.sig[id]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=S.sig[id]}
    let down=false;
    const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
    cv.onpointerdown=e=>{down=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}const p=pos(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]+.1);ctx.stroke();e.preventDefault()};
    cv.onpointermove=e=>{if(!down)return;const p=pos(e);ctx.lineTo(p[0],p[1]);ctx.stroke()};
    const end=()=>{if(!down)return;down=false;S.sig[id]=cv.toDataURL();save()};
    cv.onpointerup=end;cv.onpointercancel=end;
  });
}
function clearSig(id){delete S.sig[id];save();render()}

/* ===== Fiche FORM-192 (catégorie 1A, un candidat) ===== */
const gh=t=>({head:1,t});
const ln=(t,bar,v)=>({t,bar,v});
const cells=r=>r.head?`<td class="cr gh">${r.t}</td><td class="gh"></td><td class="gh"></td>`:`<td class="cr">${r.t}</td><td class="b">${r.bar}</td><td class="v">${fmt(r.v)}</td>`;
function theme(label,points){
  const total=points.reduce((a,p)=>a+p.rows.length,0);let out="",first=true;
  points.forEach(p=>p.rows.forEach((r,i)=>{
    out+="<tr>"+(first?`<td class="th" rowspan="${total}">${label}</td>`:"")+(i===0?`<td class="pt" rowspan="${p.rows.length}">${p.n}</td>`:"")+cells(r)+"</tr>";first=false}));
  return out;
}
const stRow=(label,bar,v)=>`<tr class="st"><td colspan="3">${label}</td><td class="b">${bar}</td><td class="v">${fmt(v)}</td></tr>`;
const tHead=()=>`<colgroup><col style="width:25mm"><col style="width:21mm"><col><col style="width:17mm"><col style="width:17mm"></colgroup>
<thead><tr><th rowspan="3">Thèmes évalués</th><th rowspan="3">Points d’évaluation</th><th rowspan="3">Critères</th><th>Barème</th><th>Candidat</th></tr>
<tr><th rowspan="2">Cat 1A</th><th>1</th></tr><tr><th>1A</th></tr></thead>`;
const LOGO=`<svg class="logo" viewBox="0 0 300 62" role="img" aria-label="Centre de formation WANTZ"><rect width="300" height="62" fill="#e30613"/><rect y="38" width="300" height="24" fill="#2b3a9e"/><polygon points="6,5 134,5 120,22 0,22" fill="#ffd400"/><text x="12" y="18" font-size="8.5" font-weight="700" font-style="italic" font-family="Arial,sans-serif" fill="#000">CENTRE DE FORMATION</text><text x="112" y="54" font-size="42" font-weight="900" font-style="italic" font-family="Arial,sans-serif" fill="#fff" stroke="#fff" stroke-width="1">WANTZ</text></svg>`;
function page(n,inner){
  return `<div class="page"><div class="ph"><div class="phl">${LOGO}<div class="ref">FORM-192 / Version 5<br>06/11/2025</div></div>
    <div class="pht">TEST PRATIQUE R489 Catégories 1A et 1B</div>
    <div class="phr"><b><i>Centre de formation WANTZ</i></b><br>Page ${n} sur 3<br>OJ</div></div>
    <div class="pbody">${inner}</div>
    <div class="pf"><div>Centre de formation WANTZ<br>Route d’Aspach - 68700 CERNAY</div>
    <div>La seule version valide est celle de l’intranet<br>http://www.groupewantz.com<br>contact@groupewantz.com</div>
    <div>Tél : 03.89.75.88.07<br>Fax : 03.89.39.89.25</div></div></div>`;
}
function fiche(){
  const g=glob(),T=THEMES.map(tst),V=(e,i)=>bst(e,0).rem[i];
  const v0=bst(2,0).rem[0],v1=bst(2,1).rem[0];
  const circ="En marche avant / en marche arrière, en ligne droite / en virage arrêter le chariot<br><i>(à évaluer en continu durant la totalité des épreuves pratiques)</i>";
  const p1=`<p class="fx">Examen pratique des CACES® pour les chariots à conducteur porté catégories 1A et 1B</p>
    <table class="cand"><tr><td class="blank"></td><th>Nom et prénom des candidats</th></tr><tr><td>Candidat 1 :</td><td>${h(S.nom)}</td></tr></table>
    <div class="ban">R.489 - CHARIOTS DE MANUTENTION AUTOMOTEURS A CONDUCTEUR PORTÉ<br>FICHE D’EVALUATION DU SAVOIR-FAIRE PRATIQUE<br>Catégorie 1A - Transpal. et préparateurs sans élévation du poste de conduite (h ≤ 1,20 m)</div>
    <table class="ft">${tHead()}<tbody>
    ${theme("Prise de poste et mise en service (10 pts)",[{n:1,rows:[gh("Vérifier la présence et la validité des documents réglementaires suivants, et savoir les exploiter :"),
      ln("Notice d’instructions (justifier une interdiction d’emploi ou une règle d’utilisation)",1,V(1,0)),
      ln("Rapport de vérification générale périodique, de mise ou de remise en service (vérifier l’absence d’observation ou de restriction d’usage)",1,V(1,1)),
      ln("Procéder à une vérification visuelle du chariot",4,V(1,2)),
      ln("Vérifier le bon fonctionnement des mécanismes et des dispositifs de sécurité",4,V(1,3))]}])}
    ${stRow("Sous total","/10",T[0].total)}
    ${theme("Conduite (20 pts)",[{n:2,rows:[gh("Circuler à vide :"),ln(circ,10,v0)]},{n:3,rows:[gh("Circuler en charge :"),ln(circ,10,v1)]}])}
    ${stRow("Sous total","/20",T[1].total)}</tbody></table>`;
  const p2=`<table class="ft">${tHead()}<tbody>
    ${theme("Manœuvres (55 pts)",[
     {n:4,rows:[gh("Prendre, déplacer et déposer au sol une charge palettisée"),
      ln("S’assurer de l’adéquation du chariot à la manutention à réaliser",7,bst(3,0).rem[0]),
      ln("Positionner le chariot pour la prise / positionner la palette sur la fourche",7,bst(3,0).rem[1]),
      ln("Vérifier le lieu de dépose / positionner le chariot et déposer la palette avec précision à l’endroit prévu",7,bst(3,0).rem[2])]},
     {n:7,rows:[gh("Effectuer le chargement et le déchargement d’un véhicule par l’arrière depuis un quai"),
      ln("S’assurer de l’adéquation du chariot et du véhicule à la manutention à réaliser",7,bst(4,0).rem[0]),
      ln("Mettre en œuvre les moyens d’accès en sécurité au véhicule",7,bst(4,0).rem[1]),
      ln("Adapter la vitesse et la trajectoire du chariot",6,bst(4,0).rem[2]),
      ln("Prendre et déposer 3 charges conformément au plan de chargement",7,bst(4,0).rem[3]),
      ln("Décharger le véhicule et déposer les charges à l’endroit prévu",7,bst(4,0).rem[4])]}])}
    ${stRow("Sous total","/55",T[2].total)}</tbody></table>`;
  const sig=S.sig.t?`<img class="sigimg" alt="Signature du testeur" src="${S.sig.t}">`:"";
  const p3=`<table class="ft">${tHead()}<tbody>
    ${theme("Fin de poste – maintenance (15 pts)",[{n:10,rows:[
      ln("Réaliser les opérations de fin de poste",5,bst(5,0).rem[0]),
      ln("Réaliser les opérations de maintenance journalière",5,bst(5,0).rem[1]),
      ln("Rendre compte des anomalies relevées",5,bst(5,0).rem[2])]}])}
    ${stRow("Sous total","/15",T[3].total)}${stRow("Total","/100",g.total)}</tbody></table>
    <div class="tb"><div class="tt">TESTEUR :</div>
    <div class="tg"><div><p>Nom : ${h(S.tnom)}</p><p>Prénom : ${h(S.tprenom)}</p><p>Date : ${frDate(S.date)}</p></div>
    <div><p>Signature :</p>${sig}<p>Entreprise : ${h(S.entreprise)}</p></div></div>
    <table class="rc"><tr><th>Candidat</th><th class="res">1</th></tr><tr><th>Reçu( R )/Echec ( E )</th><td class="res">${g.elim?"E":"R"}</td></tr></table></div>`;
  return `<div class="bar"><button onclick="setView('eval')">← Retour à l’évaluation</button><button onclick="window.print()">Imprimer / PDF</button><button id="pdfbtn" onclick="sharePdf()">Envoyer le PDF</button><button onclick="mail()">E-mail (texte)</button><button onclick="reset()">Nouveau candidat</button></div>
    <div id="pages">${page(1,p1)}${page(2,p2)}${page(3,p3)}</div>`;
}
function fit(){
  const el=document.getElementById("pages");if(!el)return;
  const w=(window.innerWidth-16)/794;el.style.zoom=w<1?w:1;
}

/* ===== Affichage ===== */
function render(){
  document.body.dataset.view=S.view;
  let html="";
  EX.forEach(ex=>{
    html+=`<section class="ex"><div class="exh"><h2>${h(ex.titre)}</h2></div>`;
    ex.blocs.forEach((b,bi)=>{
      const s=bst(ex.id,bi),th=themeOf(ex.id,bi),ts=tst(th),single=th.b.length===1;
      const bad=s.elim||(single&&ts.elim);
      html+=`<div class="bloc">${b.nom?`<h3>${h(b.nom)}</h3>`:""}
        <ul class="comp">${b.comp.map((c,i)=>`<li class="${s.rem[i]===0||s.flagE[i]?"red":""}"><span>${h(c[0])}</span><span>${s.rem[i]} / ${c[1]} pts</span></li>`).join("")}</ul>`;
      b.rows.forEach((row,ri)=>{
        const n=cnt(ex.id,bi,ri);
        if(row[1]==="E"){
          html+=`<div class="row e${n?" on":""}"><span class="lab">${h(row[0])}</span>
            <div class="ctl"><button class="elim" onclick="flipE(${ex.id},${bi},${ri})" aria-pressed="${!!n}">${n?"E – Éliminatoire":"E"}</button></div></div>`;
        }else if(row[3]){
          html+=`<div class="row${n?" zero":""}"><span class="lab">${h(row[0])}<br><small>${row[1]} pt${row[1]>1?"s":""} – décompté une seule fois</small></span>
            <div class="ctl"><button class="elim" onclick="flipE(${ex.id},${bi},${ri})" aria-pressed="${!!n}">${n?"✓ Erreur (−"+row[1]+")":"Erreur"}</button></div></div>`;
        }else{
          html+=`<div class="row${n?" zero":""}"><span class="lab">${h(row[0])}<br><small>${row[1]} pt${row[1]>1?"s":""} par erreur</small></span>
            <div class="ctl"><button onclick="adj(${ex.id},${bi},${ri},1)" aria-label="Ajouter une erreur">−</button>
            <span class="val">${n?"−"+n*row[1]:"0"}</span>
            <button onclick="adj(${ex.id},${bi},${ri},-1)" aria-label="Annuler une erreur"${n===0?" disabled":""}>+</button></div></div>`;
        }});
      const why=s.elimE?" – erreur éliminatoire":s.zero?" – note nulle":single&&ts.elim?" – sous le seuil":"";
      html+=`<div class="tot${bad?" bad":""}"><span>Total : ${fmt(s.total)} / ${s.base}${single?` <small>(seuil ${fmt(ts.seuil)})</small>`:""}</span>
        <span class="alert">⚠ CANDIDAT ÉLIMINÉ${why}</span></div>`;
      if(!single&&bi===ex.blocs.length-1){
        html+=`<div class="tot${ts.elim?" bad":""}"><span>Thème « ${h(th.nom)} » : ${fmt(ts.total)} / ${th.base} <small>(seuil ${fmt(ts.seuil)}${ex.id===3?", avec l’exercice 4":""}${ex.id===4?", avec l’exercice 3":""})</small></span>
          <span class="alert">⚠ THÈME SOUS LE SEUIL</span></div>`;
      }
      html+=`</div>`;
    });
    html+=`</section>`;
  });
  html+=recap();
  document.getElementById("app").innerHTML=html;
  const g=glob(),gt=document.getElementById("gt"),run=!!tget().start,btn=document.getElementById("chbtn");
  gt.textContent="Total : "+fmt(g.total)+" / 100";gt.className="gt"+(g.elim?" bad":"");
  btn.textContent=run?"Arrêter":"Démarrer";btn.className=run?"stop":"go";
  sigInit();
  const f=document.getElementById("fiche");
  f.innerHTML=S.view==="fiche"?fiche():"";
  if(S.view==="fiche")fit();
}

function recap(){
  const g=glob();let rows="",errs="";
  EX.forEach(ex=>{
    ex.blocs.forEach((b,bi)=>{
      const s=bst(ex.id,bi),nom=b.nom?` (${b.nom.toLowerCase()})`:"";
      rows+=`<tr><td>Exercice ${ex.id}${nom}</td><td>${fmt(s.total)} / ${s.base}</td><td>${s.elimE?"Éliminatoire":s.zero?"Note nulle":"OK"}</td></tr>`;
    });
    const list=errList(ex);
    if(list.length)errs+=`<p><strong>Exercice ${ex.id}</strong></p><ul class="err">${list.map(x=>`<li>${h(x)}</li>`).join("")}</ul>`;
  });
  const th=THEMES.map(t=>{const s=tst(t);return `<tr><td>${h(t.nom)}</td><td>${fmt(s.total)} / ${t.base}</td><td>seuil ${fmt(s.seuil)}</td><td>${s.elim?"Insuffisant":"OK"}</td></tr>`}).join("");
  return `<section class="recap"><h2>Récapitulatif</h2>
    <p class="meta"><strong>Candidat :</strong> ${h(S.nom||"—")} &nbsp; <strong>Date :</strong> ${frDate(S.date)} &nbsp; <strong>Testeur :</strong> ${h(testeur()||"—")} &nbsp; <strong>Durée :</strong> ${clock(elapsed())}</p>
    <table><tr><th>Exercice</th><th>Points</th><th>État</th></tr>${rows}</table>
    <h3>Thèmes</h3><table>${th}</table>
    <div class="verdict ${g.elim?"ko":"ok"}">TOTAL : ${fmt(g.total)} / 100 (minimum ${SEUIL_TOTAL})<br>${g.elim?"CANDIDAT ÉLIMINÉ":"CANDIDAT ADMIS"}</div>
    ${g.reasons.length?`<ul class="err">${g.reasons.map(x=>`<li>${h(x)}</li>`).join("")}</ul>`:""}
    ${errs||'<p class="err">Aucune erreur relevée.</p>'}
    <div class="sigs"><div><strong>Signature du testeur</strong><canvas class="sig" data-s="t" width="600" height="180"></canvas><button onclick="clearSig('t')">Effacer</button></div></div>
    <div class="actions"><button class="go" onclick="finEval()">Fin d’évaluation → fiche FORM-192</button><button onclick="reset()">Nouveau candidat</button></div></section>`;
}
